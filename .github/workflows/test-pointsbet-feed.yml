name: Test free greyhound feed

on:
  push:
    paths:
      - '.github/workflows/test-pointsbet-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scan every Australian greyhound race
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime, timedelta, timezone

          BASE_URL = "https://api.au.pointsbet.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                            "AppleWebKit/537.36 (KHTML, like Gecko) "
                            "Chrome/127.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-AU,en;q=0.9",
              "Origin": "https://pointsbet.com.au",
              "Referer": "https://pointsbet.com.au/",
          }

          def get_json(path, params=None):
              url = BASE_URL + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      print(f"HTTP {response.status} {path}; bytes={len(body)}")
              except urllib.error.HTTPError as error:
                  body = error.read()
                  print(f"HTTP {error.code} {path}: {body[:1000].decode('utf-8', 'replace')}")
                  raise
              return json.loads(body)

          now = datetime.now(timezone.utc)
          start = now.replace(hour=0, minute=0, second=0, microsecond=0)
          end = start + timedelta(days=2)
          iso = lambda value: value.isoformat(timespec="milliseconds").replace("+00:00", "Z")

          payload = get_json(
              "/api/racing/v4/meetings",
              {"startDate": iso(start), "endDate": iso(end)},
          )
          groups = payload if isinstance(payload, list) else payload.get("meetings", [])

          meetings = []
          for group in groups:
              candidates = group.get("meetings", []) if isinstance(group, dict) else []
              meetings.extend(
                  meeting for meeting in candidates
                  if meeting.get("racingType") == 4
                  and meeting.get("countryCode") == "AUS"
              )

          race_summaries = {}
          for meeting in meetings:
              for race in meeting.get("races") or []:
                  race_id = race.get("raceId")
                  if race_id:
                      race_summaries[str(race_id)] = {
                          "venue": meeting.get("venue"),
                          "race_number": race.get("raceNumber"),
                          "start_utc": race.get("advertisedStartDateTimeUtc"),
                      }

          race_ids = list(race_summaries)
          print(f"Australian greyhound meetings: {len(meetings)}")
          print(f"EVERY Australian greyhound race to store: {len(race_ids)}")

          race_cards = []
          for offset in range(0, len(race_ids), 20):
              batch_ids = race_ids[offset:offset + 20]
              batch = get_json(
                  "/api/racing/v3/races",
                  {"raceIds": ",".join(batch_ids)},
              )
              if isinstance(batch, list):
                  race_cards.extend(batch)
              elif isinstance(batch, dict):
                  if isinstance(batch.get("races"), list):
                      race_cards.extend(batch["races"])
                  elif batch.get("raceId"):
                      race_cards.append(batch)

          counts = Counter()
          small_fields = {4: [], 5: []}
          for race in race_cards:
              runners = race.get("runners") or []

              # Australian starters use boxes 1-8. PointsBet may also include
              # reserves 9 and 10, so do not count those as active starters.
              active = []
              for runner in runners:
                  box = runner.get("number") or runner.get("barrier")
                  try:
                      is_starting_box = 1 <= int(box) <= 8
                  except (TypeError, ValueError):
                      is_starting_box = False
                  if is_starting_box and not runner.get("isScratched", False):
                      active.append(runner)

              active_count = len(active)
              counts[active_count] += 1

              if active_count in small_fields:
                  summary = race_summaries.get(str(race.get("raceId")), {})
                  small_fields[active_count].append({
                      "venue": race.get("venue") or summary.get("venue"),
                      "race_number": race.get("number") or summary.get("race_number"),
                      "start_utc": race.get("advertisedStartTimeUtc") or summary.get("start_utc"),
                      "race_id": race.get("raceId"),
                      "dogs": [
                          {
                              "box": runner.get("number") or runner.get("barrier"),
                              "name": runner.get("runnerName"),
                              "price": (runner.get("fluctuations") or {}).get("current"),
                          }
                          for runner in active
                      ],
                  })

          print(f"Race cards returned for storage: {len(race_cards)}")
          print("Active-starter count distribution:", dict(sorted(counts.items())))

          for field_size in (4, 5):
              races = small_fields[field_size]
              print(f"{field_size}-DOG RACES FOUND: {len(races)}")
              for race in races:
                  print(
                      f"{field_size}-DOG | {race['venue']} R{race['race_number']} | "
                      f"{race['start_utc']} | raceId={race['race_id']}"
                  )
                  for dog in race["dogs"]:
                      print(
                          f"  Box {dog['box']}: {dog['name']} | "
                          f"PointsBet {dog['price']}"
                      )

          if len(race_cards) != len(race_ids):
              raise SystemExit(
                  f"FAIL: requested {len(race_ids)} race cards but received {len(race_cards)}"
              )

          print("PASS: Every race is available; front end can filter by active starter count")
          PY
